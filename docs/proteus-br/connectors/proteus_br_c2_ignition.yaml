# Proteus-BR — Conector C2 "IGNIÇÃO / ETB"
# TE Superseal 1.0, 26 vias (2 fileiras x 13). Keying: 2 (housing 3-1437290-8).
# AJUSTE sobre a proposta inicial: ETB1±/ETB2± movidos do C4 para cá —
# são saídas de potência chaveada (até ~3 A contínuos / 6 A pico por ponte
# TLE9201) e violariam a regra "nenhum sinal sensível adjacente a alta
# corrente" se ficassem junto de VR/CAN no C4.
# Saídas IGN são lógicas 5 V (buffer MIC4427/TC4427A) para bobinas smart;
# alimentação de potência das bobinas vem do chicote (relé), não da ECU.
# Fase 1 popula: IGN1-4 + GNDs. IGN5-12 e ETB1/2 = footprints não populados.

pins:
  - pin: 1
    function: GND lógico para retorno de sinal das bobinas, 20 AWG
    type: gnd
    color: black

  - pin: 2
    id: D4
    class: outputs
